<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Digital Rekap Data Air & Curah Hujan (Offline)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) for Exporting Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .tab-btn.active {
            border-bottom: 3px solid #16a34a;
            color: #16a34a;
            font-weight: bold;
        }
        input, select, textarea {
            background-color: #fefef0;
            border: 1px solid #cbd5e1;
        }
        input:focus, select:focus, textarea:focus {
            background-color: #ffffff;
            border-color: #16a34a;
            outline: none;
            box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.2);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 pb-12">

    <!-- Header Banner -->
    <header class="bg-emerald-800 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                    <i class="fa-solid font-bold fa-water"></i> Monitoring Digital Air & CH
                </h1>
                <p class="text-xs text-emerald-200">Aplikasi Rekap Lapangan Offline-First</p>
            </div>
            <div id="connection-status" class="flex items-center gap-2 bg-emerald-900 px-3 py-1 rounded-full text-xs font-semibold text-emerald-300">
                <span id="connection-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                <span id="connection-text">Online</span>
                <span id="pending-badge" class="hidden bg-amber-400 text-amber-900 rounded-full px-2 py-0.5 ml-1">0</span>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="bg-white border-b border-slate-200 shadow-sm sticky top-[60px] z-40">
        <div class="max-w-5xl mx-auto flex overflow-x-auto text-sm font-medium">
            <button onclick="switchTab('curah-hujan')" id="tab-curah-hujan" class="tab-btn active px-4 py-3 whitespace-nowrap flex items-center gap-2">
                <i class="fa-solid fa-cloud-sun-rain"></i> Curah Hujan
            </button>
            <button onclick="switchTab('water-level')" id="tab-water-level" class="tab-btn px-4 py-3 whitespace-nowrap flex items-center gap-2">
                <i class="fa-solid fa-ruler-vertical"></i> Water Level (Peilschaal)
            </button>
            <button onclick="switchTab('water-depth')" id="tab-water-depth" class="tab-btn px-4 py-3 whitespace-nowrap flex items-center gap-2">
                <i class="fa-solid fa-bore-hole"></i> Water Depth/Water Table
            </button>
            <button onclick="switchTab('rekap-data')" id="tab-rekap-data" class="tab-btn px-4 py-3 whitespace-nowrap flex items-center gap-2 text-emerald-700">
                <i class="fa-solid fa-table"></i> Rekap Data & Ekspor

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto p-4 md:p-6">

        <!-- 1. FORM CURAH HUJAN -->

            <form id="form-curah-hujan" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Region <span class="text-rose-500">*</span></label>
                    <select name="region" required onchange="updateDistrictOptions(this)" class="w-full p-2 text-sm rounded">
                        <option value="Jambi">Jambi</option>
                        <option value="Muba">Muba</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">District <span class="text-rose-500">*</span></label>
                    <select name="district" required class="w-full p-2 text-sm rounded"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kode Stasiun CH <span class="text-rose-500">*</span></label>
                    <input type="text" name="kode_stasiun" required placeholder="Contoh: ST-CH-01" class="w-full p-2 text-sm rounded">

                <div>

                <div>

                    <input type="time" name="waktu_survey" class="w-full p-2 text-sm rounded">
                </div>

                    <label class="block text-xs font-semibold text-slate-600 mb-1">Curah Hujan (mm)</label>
                    <input type="number" step="0.1" name="curah_hujan" placeholder="0.0" class="w-full p-2 text-sm rounded">

                        <i class="fa-solid fa-floppy-disk"></i> Save Local

                    <button type="button" onclick="saveData('curah-hujan', true)" class="bg-teal-600 hover:bg-teal-700 text-white font-medium px-5 py-2 rounded text-sm flex items-center gap-2">

        <!-- 3. FORM WATER DEPTH -->

            <h2 class="text-lg font-bold text-slate-700 mb-4 border-b pb-2 flex items-center gap-2">

            <form id="form-water-depth" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Region <span class="text-rose-500">*</span></label>
                    <select name="region" required onchange="updateDistrictOptions(this)" class="w-full p-2 text-sm rounded">
                        <option value="Jambi">Jambi</option>
                        <option value="Muba">Muba</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">District <span class="text-rose-500">*</span></label>
                    <select name="district" required class="w-full p-2 text-sm rounded"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tipe Titik Pantau <span class="text-rose-500">*</span></label>
                    <select name="tipe_pantau" required class="w-full p-2 text-sm rounded">

                    <input type="text" name="kode_pantau" required placeholder="Kode Titik Pantau" class="w-full p-2 text-sm rounded">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Titik Pantau</label>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">OGL (m)</label>
                    <input type="number" step="0.01" name="ogl" placeholder="0.00" class="w-full p-2 text-sm rounded">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tgl Survey</label>
                    <input type="date" name="tgl_survey" required class="w-full p-2 text-sm rounded">
                </div>

                    <label class="block text-xs font-semibold text-slate-600 mb-1">Waktu Survey</label>

                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Stasiun Curah Hujan</label>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Curah Hujan (mm)</label>
                    <input type="number" step="0.1" name="curah_hujan" placeholder="0.0" class="w-full p-2 text-sm rounded">

                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tinggi Pipa Instalasi (m)</label>
                    <input type="number" step="0.01" id="tinggi_instalasi" name="tinggi_instalasi" placeholder="0.00" oninput="calcWT()" class="w-full p-2 text-sm rounded">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tinggi Pipa (m)</label>

    <!-- App Script -->
    <script>
        // ==========================================================
        // KONFIGURASI GOOGLE APPS SCRIPT (WAJIB DIISI SETELAH DEPLOY)
        // ==========================================================
        // 1. Deploy Code.gs sebagai Web App (lihat panduan yang diberikan terpisah).
        // 2. Salin URL Web App (diakhiri "/exec") dan tempel di bawah ini.
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzAMk909tLwGekxPGX1E1e6NGtYF5Y9bJeHavQ7FwClyPAh0p_dAUdtq9rCJlEaYNdE/exec';
        // Kunci sederhana opsional untuk mencegah orang lain mengirim data acak
        // ke Sheet Anda. Nilainya harus SAMA PERSIS dengan API_KEY di Code.gs.
        const GAS_API_KEY = 'WMreport2026';

        // Region -> District mapping
        const DISTRICT_MAP = {
            'Jambi': ['Distrik I', 'Distrik II', 'Distrik V', 'Distrik VI', 'Distrik VII'],
            'Muba': ['Merang', 'Buring', 'Mendis', 'Sei Benu', 'Sembilang', 'Sei Puding', 'Sei Hitam', 'Sei Terentang']
        };

        // Populate/refresh the District dropdown based on the selected Region
        function updateDistrictOptions(regionSelect, keepValue = null) {
            const form = regionSelect.closest('form');
            const districtSelect = form.querySelector('select[name="district"]');
            if (!districtSelect) return;
            const districts = DISTRICT_MAP[regionSelect.value] || [];
            const previous = keepValue !== null ? keepValue : districtSelect.value;
            districtSelect.innerHTML = districts.map(d => `<option value="${d}">${d}</option>`).join('');
            if (districts.includes(previous)) districtSelect.value = previous;
        }

        // Initialize Default Dates
        document.querySelectorAll('input[type="date"]').forEach(el => el.value = new Date().toISOString().split('T')[0]);
        document.querySelectorAll('input[type="time"]').forEach(el => {
            const now = new Date();
            el.value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        });

        // Initialize District dropdowns on page load
        document.querySelectorAll('select[name="region"]').forEach(sel => updateDistrictOptions(sel));

        // Initialize connection status badge and try to flush any pending offline data
        updateConnectionStatus();
        if (navigator.onLine) syncPendingData(false);

        // Tab Switching Function
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`sec-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('active');

            if (tabName === 'rekap-data') {
                renderTable();
            }
        }

        // Automatic WT Calculation: WT = Kedalaman Air Pipa - Tinggi Pipa (atau penyesuaian lapangan)
        function calcWT() {
            const tp = parseFloat(document.getElementById('tinggi_pipa').value) || 0;
            const kap = parseFloat(document.getElementById('kedalaman_air').value) || 0;
            const wt = kap - tp;
            document.getElementById('wt').value = wt ? wt.toFixed(2) : '0.00';
        }

        // Column definitions per category, used so the table always shows headers
        // (even when empty) and stays in a consistent, readable order.
        const FIELD_LABELS = {
            'curah-hujan': [
                ['region', 'Region'], ['district', 'District'], ['kode_stasiun', 'Kode Stasiun CH'],
                ['nama_stasiun', 'Nama Stasiun'], ['ogl', 'OGL (m)'], ['tgl_survey', 'Tgl Survey'],
                ['waktu_survey', 'Waktu Survey'], ['curah_hujan', 'Curah Hujan (mm)'],
                ['surveyor', 'Surveyor'], ['keterangan', 'Keterangan']
            ],
            'water-level': [
                ['region', 'Region'], ['district', 'District'], ['kode_peilschaal', 'Kode Peilschaal'],
                ['nama_peilschaal', 'Nama Peilschaal'], ['ogl', 'OGL (m)'], ['tgl_survey', 'Tgl Survey'],
                ['waktu_survey', 'Waktu Survey'], ['stasiun_ch', 'Stasiun CH'], ['curah_hujan', 'Curah Hujan (mm)'],
                ['water_level', 'Water Level (m)'], ['surveyor', 'Surveyor'], ['keterangan', 'Keterangan']
            ],
            'water-depth': [
                ['region', 'Region'], ['district', 'District'], ['tipe_pantau', 'Tipe Titik Pantau'],
                ['kode_pantau', 'Kode Titik Pantau'], ['nama_pantau', 'Nama Titik Pantau'], ['ogl', 'OGL (m)'],
                ['tgl_survey', 'Tgl Survey'], ['waktu_survey', 'Waktu Survey'], ['stasiun_ch', 'Stasiun CH'],
                ['curah_hujan', 'Curah Hujan (mm)'], ['tinggi_instalasi', 'Tinggi Pipa Instalasi (m)'],
                ['tinggi_pipa', 'Tinggi Pipa (m)'], ['kedalaman_air', 'Kedalaman Air Pipa (m)'],
                ['wt', 'WT (m)'], ['petak_id', 'Petak ID'], ['plant_date', 'Plant Date'],
                ['surveyor', 'Surveyor'], ['keterangan', 'Keterangan']
            ]
        };

        // Helper: reset a form's date/time defaults and its District dropdown
        function resetFormDefaults(form) {
            form.querySelectorAll('input[type="date"]').forEach(el => {
                if (!el.id || el.id !== 'plant_date') el.value = new Date().toISOString().split('T')[0];
            });
            form.querySelectorAll('input[type="time"]').forEach(el => {
                const now = new Date();
                el.value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            });
            const regionSelect = form.querySelector('select[name="region"]');
            if (regionSelect) updateDistrictOptions(regionSelect, null);
        }

        // Save Data Function (Save Local / Save & Export Excel)
        function saveData(category, autoExportExcel = false) {
            const form = document.getElementById(`form-${category}`);

            // Native validation for required fields (Region, District, Kode, Tgl Survey, dll)
            if (!form.reportValidity()) {
                return;
            }

            const formData = new FormData(form);
            const dataObj = { id: Date.now(), synced: false };

            formData.forEach((value, key) => {
                dataObj[key] = value;
            });

            // Get existing data from localStorage
            let currentData = JSON.parse(localStorage.getItem(category) || '[]');
            currentData.push(dataObj);
            localStorage.setItem(category, JSON.stringify(currentData));

            alert(`Data ${category.replace('-', ' ')} berhasil disimpan secara lokal!`);

            if (autoExportExcel) {
                const { id, synced, ...exportObj } = dataObj;
                exportSingleFormToExcel(category, [exportObj]);
            }

            form.reset();
            resetFormDefaults(form);
            updateConnectionStatus();
        }

        // ==========================================================
        // INTEGRASI GOOGLE SHEETS (CLOUD SYNC)
        // ==========================================================

        // Kirim satu record ke Google Apps Script Web App.
        // Content-Type "text/plain" sengaja dipakai supaya browser TIDAK
        // mengirim preflight OPTIONS (yang tidak didukung baik oleh GAS).
        async function sendToGoogleSheets(category, dataObj) {
            if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.indexOf('GANTI_DENGAN') !== -1) {
                throw new Error('URL Web App GAS belum diisi di dalam kode HTML.');
            }
            await fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // respons tidak bisa dibaca; keberhasilan hanya berarti request terkirim
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ category: category, apiKey: GAS_API_KEY, data: dataObj })
            });
        }

        // Tombol "Kirim ke Cloud / Google Sheets" pada tiap form
        async function sendFormToCloud(category) {
            const form = document.getElementById(`form-${category}`);
            if (!form.reportValidity()) return;

            const formData = new FormData(form);
            const dataObj = { id: Date.now(), synced: false };
            formData.forEach((value, key) => { dataObj[key] = value; });

            // Offline-first: selalu simpan ke localStorage terlebih dahulu
            let currentData = JSON.parse(localStorage.getItem(category) || '[]');
            currentData.push(dataObj);
            localStorage.setItem(category, JSON.stringify(currentData));

            if (!navigator.onLine) {
                alert('Anda sedang OFFLINE. Data sudah tersimpan aman secara lokal dan akan otomatis dikirim ke Google Sheets begitu koneksi internet tersedia kembali.');
                form.reset();
                resetFormDefaults(form);
                updateConnectionStatus();
                renderTable();
                return;
            }

            try {
                await sendToGoogleSheets(category, dataObj);
                markAsSynced(category, dataObj.id);
                alert('Data berhasil dikirim ke Google Sheets (cloud)!\n\nCatatan: karena permintaan dikirim dalam mode "no-cors", aplikasi tidak dapat membaca balasan sukses/gagal dari server secara pasti — pastikan URL Web App & akses "Anyone" sudah benar, lalu cek Google Sheets secara berkala.');
            } catch (err) {
                alert('Tidak bisa terhubung ke server (kemungkinan jaringan bermasalah atau URL GAS belum diisi). Data tetap tersimpan lokal dan akan dicoba kirim ulang otomatis saat online.');
            }

            form.reset();
            resetFormDefaults(form);
            updateConnectionStatus();
            renderTable();
        }

        // Tandai satu record sebagai sudah tersinkron
        function markAsSynced(category, id) {
            let data = JSON.parse(localStorage.getItem(category) || '[]');
            data = data.map(row => row.id === id ? Object.assign({}, row, { synced: true }) : row);
            localStorage.setItem(category, JSON.stringify(data));
        }

        // Sinkronkan semua data yang masih berstatus "belum terkirim" ke Google Sheets.
        // Dipanggil otomatis saat koneksi kembali online, dan bisa dipicu manual
        // lewat tombol "Sinkronkan Semua Data Offline" di tab Rekap Data.
        let isSyncing = false;
        async function syncPendingData(manualTrigger = false) {
            if (isSyncing) return;
            if (!navigator.onLine) {
                if (manualTrigger) alert('Tidak ada koneksi internet saat ini. Coba lagi nanti.');
                return;
            }
            if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.indexOf('GANTI_DENGAN') !== -1) {
                if (manualTrigger) alert('URL Web App GAS belum diisi di dalam kode HTML. Lengkapi dulu sebelum sinkronisasi.');
                return;
            }

            isSyncing = true;
            const categories = ['curah-hujan', 'water-level', 'water-depth'];
            let syncedCount = 0;
            let failedCount = 0;

            for (const cat of categories) {
                let data = JSON.parse(localStorage.getItem(cat) || '[]');
                const pending = data.filter(row => !row.synced);
                for (const row of pending) {
                    try {
                        await sendToGoogleSheets(cat, row);
                        row.synced = true;
                        syncedCount++;
                    } catch (e) {
                        failedCount++;
                        break; // koneksi kemungkinan terputus lagi, hentikan sisa antrean kategori ini
                    }
                }
                localStorage.setItem(cat, JSON.stringify(data));
            }

            isSyncing = false;
            updateConnectionStatus();
            renderTable();

            if (manualTrigger) {
                if (syncedCount === 0 && failedCount === 0) {
                    alert('Tidak ada data offline yang perlu disinkronkan. Semua data sudah terkirim ke cloud.');
                } else {
                    alert(`Sinkronisasi selesai.\nBerhasil dikirim: ${syncedCount} data.` + (failedCount > 0 ? `\nGagal/masih offline: ${failedCount} data (akan dicoba lagi otomatis).` : ''));
                }
            }
        }

        // Update badge status koneksi + jumlah data yang masih menunggu sinkron
        function updateConnectionStatus() {
            const dot = document.getElementById('connection-dot');
            const text = document.getElementById('connection-text');
            const badge = document.getElementById('pending-badge');
            const online = navigator.onLine;

            dot.className = `w-2.5 h-2.5 rounded-full inline-block animate-pulse ${online ? 'bg-emerald-400' : 'bg-rose-400'}`;
            text.innerText = online ? 'Online' : 'Offline';

            const categories = ['curah-hujan', 'water-level', 'water-depth'];
            let pendingTotal = 0;
            categories.forEach(cat => {
                const data = JSON.parse(localStorage.getItem(cat) || '[]');
                pendingTotal += data.filter(row => !row.synced).length;
            });

            if (pendingTotal > 0) {
                badge.classList.remove('hidden');
                badge.innerText = `${pendingTotal} menunggu`;
            } else {
                badge.classList.add('hidden');
            }
        }

        window.addEventListener('online', () => { updateConnectionStatus(); syncPendingData(false); });
        window.addEventListener('offline', updateConnectionStatus);

        // Export Single Entry to Excel
        function exportSingleFormToExcel(category, dataArr) {
            const worksheet = XLSX.utils.json_to_sheet(dataArr);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, category.toUpperCase());
            
            const fileName = `Rekap_${category}_${new Date().toISOString().split('T')[0]}.xlsx`;
            XLSX.writeFile(workbook, fileName);
        }

        // Export All Data (Multi-Sheet Excel)
        function exportAllToExcel() {
            const categories = ['curah-hujan', 'water-level', 'water-depth'];
            const workbook = XLSX.utils.book_new();
            let hasData = false;

            categories.forEach(cat => {
                const data = JSON.parse(localStorage.getItem(cat) || '[]').map(({ id, synced, ...rest }) => rest);
                if (data.length > 0) {
                    hasData = true;
                    const ws = XLSX.utils.json_to_sheet(data);
                    XLSX.utils.book_append_sheet(workbook, ws, cat.toUpperCase());
                }
            });

            if (!hasData) {
                alert('Belum ada data tersimpan di aplikasi!');
                return;
            }

            XLSX.writeFile(workbook, `Rekap_Lengkap_Monitoring_Air_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        // Render Rekap Table
        function renderTable() {
            const category = document.getElementById('rekap-category').value;
            const searchTerm = (document.getElementById('rekap-search').value || '').toLowerCase().trim();
            const allData = JSON.parse(localStorage.getItem(category) || '[]');
            const columns = FIELD_LABELS[category] || [];
            const headContainer = document.getElementById('table-head');
            const bodyContainer = document.getElementById('table-body');
            const countBadge = document.getElementById('rekap-count');

            // Filter by search term across all visible fields
            const data = searchTerm
                ? allData.filter(row => columns.some(([key]) => String(row[key] || '').toLowerCase().includes(searchTerm)))
                : allData;

            // Newest entries first
            const sortedData = [...data].reverse();

            countBadge.innerText = `${allData.length} data` + (searchTerm ? ` (${data.length} cocok)` : '');

            headContainer.innerHTML = '';
            bodyContainer.innerHTML = '';

            // Always render headers, even when there is no data yet
            columns.forEach(([, label]) => {
                const th = document.createElement('th');
                th.className = 'p-2 border-b uppercase font-bold text-[10px] text-slate-600 bg-slate-50 whitespace-nowrap';
                th.innerText = label;
                headContainer.appendChild(th);
            });
            const thAction = document.createElement('th');
            thAction.className = 'p-2 border-b uppercase font-bold text-[10px] text-slate-600 bg-slate-50 text-center';
            thAction.innerText = 'Cloud';
            headContainer.appendChild(thAction);
            const thDelete = document.createElement('th');
            thDelete.className = 'p-2 border-b uppercase font-bold text-[10px] text-slate-600 bg-slate-50 text-center';
            thDelete.innerText = 'Aksi';
            headContainer.appendChild(thDelete);

            if (sortedData.length === 0) {
                const emptyMsg = allData.length === 0 ? 'Belum ada data tersimpan.' : 'Tidak ada data yang cocok dengan pencarian.';
                bodyContainer.innerHTML = `<tr><td colspan="${columns.length + 2}" class="p-4 text-center text-slate-400">${emptyMsg}</td></tr>`;
                return;
            }

            sortedData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 border-b';
                columns.forEach(([key]) => {
                    const td = document.createElement('td');
                    td.className = 'p-2 border-slate-100 whitespace-nowrap';
                    td.innerText = row[key] || '-';
                    tr.appendChild(td);
                });
                const tdStatus = document.createElement('td');
                tdStatus.className = 'p-2 border-slate-100 text-center';
                tdStatus.innerHTML = row.synced
                    ? '<i class="fa-solid fa-cloud-arrow-up text-emerald-600" title="Sudah terkirim ke Google Sheets"></i>'
                    : '<i class="fa-solid fa-triangle-exclamation text-amber-500" title="Masih tersimpan lokal, belum terkirim ke Google Sheets"></i>';
                tr.appendChild(tdStatus);
                const tdAction = document.createElement('td');
                tdAction.className = 'p-2 border-slate-100 text-center';
                tdAction.innerHTML = `<button onclick="deleteRecord('${category}', ${row.id})" class="text-rose-600 hover:text-rose-800" title="Hapus data ini"><i class="fa-solid fa-trash-can"></i></button>`;
                tr.appendChild(tdAction);
                bodyContainer.appendChild(tr);
            });
        }

        // Delete a single record from a category
        function deleteRecord(category, id) {
            if (!confirm('Hapus data ini secara permanen?')) return;
            let currentData = JSON.parse(localStorage.getItem(category) || '[]');
            currentData = currentData.filter(row => row.id !== id);
            localStorage.setItem(category, JSON.stringify(currentData));
            updateConnectionStatus();
            renderTable();
        }

        // Clear All Database
        function clearAllStoredData() {
            if (confirm('Apakah Anda yakin ingin menghapus seluruh rekap data yang tersimpan?')) {
                localStorage.clear();
                renderTable();
                alert('Database berhasil dikosongkan.');
            }
        }
    </script>
